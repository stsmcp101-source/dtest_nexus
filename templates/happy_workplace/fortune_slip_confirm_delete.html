{% extends "base/base.html" %}
{% block title %}ลบคำทำนายเซียมซี — {{ APP_DISPLAY_NAME }}{% endblock %}
{% block content %}
<div class="form-panel">
  <h2 style="font-family:'Poppins',sans-serif;color:var(--navy-700);font-size:19px;margin:0 0 10px;">ยืนยันการลบคำทำนาย</h2>
  <p style="color:var(--muted);font-size:14px;">คุณต้องการลบใบที่ {{ slip.order }} ใช่หรือไม่? การกระทำนี้ไม่สามารถย้อนกลับได้</p>
  <div style="width:160px;margin-bottom:18px;">
    <img src="{{ slip.image.url }}" alt="" style="width:100%;border-radius:8px;">
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger btn-app">ยืนยันการลบ</button>
      <a class="btn btn-ghost btn-app" href="{% url 'happy_workplace:manage' %}">ยกเลิก</a>
    </div>
  </form>
</div>
{% endblock %}
