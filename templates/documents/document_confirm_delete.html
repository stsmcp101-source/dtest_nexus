{% extends "base/base.html" %}
{% block title %}ลบเอกสาร — {{ APP_DISPLAY_NAME }}{% endblock %}
{% block content %}
<div class="form-panel">
  <h2 style="font-family:'Poppins',sans-serif;color:var(--navy-700);font-size:19px;margin:0 0 10px;">ยืนยันการลบเอกสาร</h2>
  <p style="color:var(--muted);font-size:14px;">คุณต้องการลบเอกสาร <strong>{{ document.document_code }} — {{ document.document_name }}</strong> ใช่หรือไม่? การกระทำนี้ไม่สามารถย้อนกลับได้</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger btn-app">ยืนยันการลบ</button>
      <a class="btn btn-ghost btn-app" href="{% url 'documents:detail' document.pk %}">ยกเลิก</a>
    </div>
  </form>
</div>
{% endblock %}
