<div class="calc-grid">
  <div>
    <div class="form-group">
      <label class="form-label">รูปแบบไฟฟ้า</label>
      <select class="form-input" id="power-phase">
        <option value="1">1 เฟส / DC (P = V × I × PF)</option>
        <option value="3">3 เฟส (P = √3 × V × I × PF)</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">แรงดันไฟฟ้า V (Volt)</label><input class="form-input" type="number" id="power-v" value="220" step="any"></div>
    <div class="form-group"><label class="form-label">กระแสไฟฟ้า I (Amp)</label><input class="form-input" type="number" id="power-i" value="10" step="any"></div>
    <div class="form-group"><label class="form-label">Power Factor (PF)</label><input class="form-input" type="number" id="power-pf" value="0.9" step="any" min="0" max="1"></div>
  </div>
  <div class="unit-result-list" id="power-result"></div>
</div>
