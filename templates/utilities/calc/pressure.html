<div class="calc-grid">
  <div>
    <div class="form-group"><label class="form-label">ค่าความดัน</label><input class="form-input" type="number" id="press-value" value="1" step="any"></div>
    <div class="form-group">
      <label class="form-label">หน่วย</label>
      <select class="form-input" id="press-unit">
        <option value="atm">Atmosphere (atm)</option>
        <option value="pa">Pascal (Pa)</option>
        <option value="kpa">Kilopascal (kPa)</option>
        <option value="bar">Bar</option>
        <option value="psi">PSI</option>
        <option value="kgfcm2">kgf/cm²</option>
        <option value="mmhg">mmHg</option>
      </select>
    </div>
  </div>
  <div class="unit-result-list" id="press-result"></div>
</div>
