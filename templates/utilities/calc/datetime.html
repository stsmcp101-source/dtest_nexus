<div class="tool-op-panel" style="margin-bottom:16px;">
  <h3>ระยะห่างระหว่างวันที่</h3>
  <div class="calc-inline-row" style="margin-bottom:14px;">
    <div class="form-group"><label class="form-label">วันที่เริ่มต้น</label><input class="form-input" type="date" id="dt1-start"></div>
    <div class="form-group"><label class="form-label">วันที่สิ้นสุด</label><input class="form-input" type="date" id="dt1-end"></div>
  </div>
  <div class="calc-result"><div class="calc-result-label">ระยะห่าง</div><div class="calc-result-value" id="dt1-result">—</div></div>
</div>

<div class="tool-op-panel">
  <h3>บวก / ลบ จำนวนวัน</h3>
  <div class="calc-inline-row" style="margin-bottom:14px;">
    <div class="form-group"><label class="form-label">วันที่เริ่มต้น</label><input class="form-input" type="date" id="dt2-start"></div>
    <div class="form-group"><label class="form-label">จำนวนวัน (ใส่ค่าลบได้)</label><input class="form-input" type="number" id="dt2-days" value="30" step="1"></div>
  </div>
  <div class="calc-result"><div class="calc-result-label">วันที่ผลลัพธ์</div><div class="calc-result-value" id="dt2-result">—</div></div>
</div>
