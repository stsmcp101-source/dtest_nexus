<div class="tool-op-panel" style="margin-bottom:16px;">
  <h3>X คือกี่เปอร์เซ็นต์ของ Y</h3>
  <div class="calc-inline-row" style="margin-bottom:14px;">
    <div class="form-group"><label class="form-label">X</label><input class="form-input" type="number" id="pct1-x" value="25" step="any"></div>
    <div class="form-group"><label class="form-label">Y</label><input class="form-input" type="number" id="pct1-y" value="200" step="any"></div>
  </div>
  <div class="calc-result"><div class="calc-result-label">ผลลัพธ์</div><div class="calc-result-value" id="pct1-result">—</div></div>
</div>

<div class="tool-op-panel" style="margin-bottom:16px;">
  <h3>Y% ของ X เท่ากับเท่าไร</h3>
  <div class="calc-inline-row" style="margin-bottom:14px;">
    <div class="form-group"><label class="form-label">เปอร์เซ็นต์ (%)</label><input class="form-input" type="number" id="pct2-pct" value="15" step="any"></div>
    <div class="form-group"><label class="form-label">X</label><input class="form-input" type="number" id="pct2-x" value="1500" step="any"></div>
  </div>
  <div class="calc-result"><div class="calc-result-label">ผลลัพธ์</div><div class="calc-result-value" id="pct2-result">—</div></div>
</div>

<div class="tool-op-panel">
  <h3>เปลี่ยนจาก X เป็น Y คิดเป็นกี่เปอร์เซ็นต์</h3>
  <div class="calc-inline-row" style="margin-bottom:14px;">
    <div class="form-group"><label class="form-label">ค่าเดิม (X)</label><input class="form-input" type="number" id="pct3-x" value="100" step="any"></div>
    <div class="form-group"><label class="form-label">ค่าใหม่ (Y)</label><input class="form-input" type="number" id="pct3-y" value="120" step="any"></div>
  </div>
  <div class="calc-result"><div class="calc-result-label">ผลลัพธ์</div><div class="calc-result-value" id="pct3-result">—</div></div>
</div>
