<div class="calc-grid">
  <div>
    <div class="form-group"><label class="form-label">เวลาที่ใช้ผลิตจริงทั้งหมด (นาที)</label><input class="form-input" type="number" id="cycle-time" value="450" step="any"></div>
    <div class="form-group"><label class="form-label">จำนวนที่ผลิตได้จริง (ชิ้น)</label><input class="form-input" type="number" id="cycle-count" value="380" step="any"></div>
  </div>
  <div class="calc-result">
    <div class="calc-result-label">Cycle Time</div>
    <div class="calc-result-value" id="cycle-result">—</div>
    <div class="calc-result-hint">เวลาที่ใช้จริงต่อการผลิต 1 ชิ้น</div>
  </div>
</div>
