<div class="calc-grid">
  <div>
    <div class="form-group">
      <label class="form-label">ค่าความสามารถทำความเย็น</label>
      <input class="form-input" type="number" id="cap-value" value="12000" step="any">
    </div>
    <div class="form-group">
      <label class="form-label">หน่วย</label>
      <select class="form-input" id="cap-unit">
        <option value="btu">BTU/hr</option>
        <option value="tr">Ton of Refrigeration (TR)</option>
        <option value="kw">kW</option>
        <option value="kcal">kcal/hr</option>
        <option value="w">Watt</option>
      </select>
    </div>
  </div>
  <div class="unit-result-list" id="cap-result"></div>
</div>
