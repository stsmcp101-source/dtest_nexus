<div class="calc-grid">
  <div>
    <div class="form-group">
      <label class="form-label">ค่าอุณหภูมิ</label>
      <input class="form-input" type="number" id="temp-value" value="25" step="any">
    </div>
    <div class="form-group">
      <label class="form-label">หน่วย</label>
      <select class="form-input" id="temp-unit">
        <option value="C">Celsius (°C)</option>
        <option value="F">Fahrenheit (°F)</option>
        <option value="K">Kelvin (K)</option>
      </select>
    </div>
  </div>
  <div class="unit-result-list" id="temp-result"></div>
</div>
