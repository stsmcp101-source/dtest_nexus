<div class="calc-grid">
  <div>
    <div class="form-group"><label class="form-label">เงินเดือน (บาท)</label><input class="form-input" type="number" id="sal-monthly" value="15000" step="any"></div>
    <div class="form-group"><label class="form-label">จำนวนวันทำงาน/เดือน</label><input class="form-input" type="number" id="sal-workdays" value="30" step="any"></div>
    <div class="form-group"><label class="form-label">ชั่วโมงทำงาน/วัน</label><input class="form-input" type="number" id="sal-hours" value="8" step="any"></div>
    <div class="form-group"><label class="form-label">ชั่วโมง OT วันทำงานปกติ</label><input class="form-input" type="number" id="sal-ot-normal" value="0" step="any"></div>
    <div class="form-group"><label class="form-label">ชั่วโมงทำงานวันหยุด (ในเวลา)</label><input class="form-input" type="number" id="sal-holiday" value="0" step="any"></div>
    <div class="form-group"><label class="form-label">ชั่วโมง OT วันหยุด</label><input class="form-input" type="number" id="sal-ot-holiday" value="0" step="any"></div>
  </div>
  <div>
    <div class="unit-result-list" id="sal-result" style="margin-bottom:14px;"></div>
    <p class="calc-result-hint">ใช้อัตราโดยประมาณตาม พ.ร.บ. คุ้มครองแรงงาน (OT วันทำงาน ×1.5, ทำงานวันหยุด ×1.0 เพิ่มจากเงินเดือน, OT วันหยุด ×3.0) เพื่อการประมาณการเบื้องต้นเท่านั้น โปรดตรวจสอบกับฝ่ายบุคคล</p>
  </div>
</div>
